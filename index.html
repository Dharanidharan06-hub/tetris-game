
<!DOCTYPE html>
<html>
<head>
<title>My Tetris Game</title>
<style>
body {
  background: #101020;
  color: white;
  text-align: center;
  font-family: Arial;
}
h1 { color: cyan; }
canvas {
  background: black;
  border: 3px solid cyan;
  width: 300px;
  max-width: 90%;
}
button {
  padding: 12px 20px;
  margin: 8px;
  background: cyan;
  border: 0;
  cursor: pointer;
}
</style>
</head>
<body>

<h1>MY TETRIS GAME</h1>
<h3>Score: <span id="score">0</span></h3>
<canvas id="game" width="300" height="600"></canvas>
<p>Arrow keys: Move | Up: Rotate</p>
<button onclick="startGame()">START GAME</button>
<button onclick="pauseGame()">PAUSE</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const cols = 10, rows = 20, size = 30;
const colors = [
  null, "#00ffff", "#ffff00", "#a000ff",
  "#00ff00", "#ff0000", "#0000ff", "#ff9900"
];

const shapes = [
  [],
  [[1,1,1,1]],
  [[2,2],[2,2]],
  [[0,3,0],[3,3,3]],
  [[0,4,4],[4,4,0]],
  [[5,5,0],[0,5,5]],
  [[6,0,0],[6,6,6]],
  [[0,0,7],[7,7,7]]
];

let board, piece, score, timer, running = false;

function emptyBoard() {
  return Array.from({length: rows}, () => Array(cols).fill(0));
}

function newPiece() {
  let type = 1 + Math.floor(Math.random() * 7);
  piece = {
    shape: shapes[type].map(row => [...row]),
    x: 3, y: 0
  };
  if (collide()) {
    running = false;
    clearInterval(timer);
    alert("Game Over! Your score: " + score);
  }
}

function collide() {
  return piece.shape.some((row, y) =>
    row.some((value, x) => value &&
      (piece.x+x < 0 || piece.x+x >= cols ||
       piece.y+y >= rows ||
       (board[piece.y+y] && board[piece.y+y][piece.x+x]))
    )
  );
}

function drawCell(x,y,color) {
  ctx.fillStyle = color;
  ctx.fillRect(x*size,y*size,size-1,size-1);
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  board.forEach((row,y) => row.forEach((v,x) => {
    if(v) drawCell(x,y,colors[v]);
  }));
  if(piece) piece.shape.forEach((row,y) =>
    row.forEach((v,x) => {
      if(v) drawCell(piece.x+x,piece.y+y,colors[v]);
    })
  );
  document.getElementById("score").textContent = score;
}

function merge() {
  piece.shape.forEach((row,y) => row.forEach((v,x) => {
    if(v) board[piece.y+y][piece.x+x] = v;
  }));
}

function clearLines() {
  for(let y=rows-1;y>=0;y--) {
    if(board[y].every(v=>v)) {
      board.splice(y,1);
      board.unshift(Array(cols).fill(0));
      score += 100;
      y++;
    }
  }
}

function move(dx,dy) {
  piece.x += dx;
  piece.y += dy;
  if(collide()) {
    piece.x -= dx;
    piece.y -= dy;
    return false;
  }
  return true;
}

function rotate() {
  const old = piece.shape;
  piece.shape = old[0].map((_,i) =>
    old.map(row=>row[i]).reverse()
  );
  if(collide()) piece.shape = old;
}

function drop() {
  if(!running) return;
  if(!move(0,1)) {
    merge();
    clearLines();
    newPiece();
  }
  draw();
}

function startGame() {
  clearInterval(timer);
  board = emptyBoard();
  score = 0;
  running = true;
  newPiece();
  draw();
  timer = setInterval(drop,500);
}

function pauseGame() {
  if(!running) return;
  running = false;
  clearInterval(timer);
}

document.addEventListener("keydown", e => {
  if(!running) return;
  if(e.key === "ArrowLeft") move(-1,0);
  if(e.key === "ArrowRight") move(1,0);
  if(e.key === "ArrowDown") drop();
  if(e.key === "ArrowUp") rotate();
  draw();
});

draw();
</script>
</body>
</html>
